      time: "2024.9 - 2025.4"
      details: "通过深度强化学习和可微分 MPC，实现 FPV 无人机在高速状态下穿越多个动态物体，并安全到达目标点。在Isaac Sim中搭建自定义无人机仿真平台，并部署 PX4 后端以实现高效且真实的并行训练，确保优秀的 Sim2Real 迁移效果。最终在室内动捕环境中完成实际飞行测试，成功实现无人机在不同初始状态下穿越动态环境的任务。"
      tech: "技术：深度强化学习、MPC、Isaac Sim、无人机 (UAV)"
