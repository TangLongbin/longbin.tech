    time: "2025.7 - Now"
    details: '<ul class="detail-list"><li>Contributed to a RoboTruck multi-modal BEV perception base model and designed latent-to-early BEV temporal fusion: aligning and residually fusing historical BEV features into current-frame features to replace expensive multi-frame point-cloud concatenation; optimized OHEM sampling, improving partial AP by 10-30% and reducing missing/false detections by ~30-40%.</li><li>Owned RoboTruck trailer detection optimization with LiDAR BEV regression, kinematic priors, dynamic ROI, and Kalman Filter post-processing; improved robustness through data resampling, onboard C++ deployment, and validation loops, reducing overall angle error by ~12%.</li><li>Improved point-cloud obstacle merging by combining PointNet/Transformer with upstream semantic priors to infer polygon merge relationships, mitigating over-splitting and improving tracking/PNC input completeness.</li><li>Refactored multi-source heuristic hint selection across box, track, and FCN polygon representations, using geometry consistency and ROI/lane relations to reduce under/over-segmentation issues by ~10%.</li></ul>'
    tech: "Techs: BEV Perception, LiDAR-Camera Fusion, Transformer, C++/Python"
  - role: "Robotics Algorithm Intern"
    company: "GalaXeaAI"
    company_url: "https://galaxea-ai.com"
    time: "2024.2 - 2024.6"
    details: '<ul class="detail-list"><li>Contributed to the mobile robot 3D Semantic Occupancy data loop by generating semantic OCC supervision from surround-view cameras and LiDAR SLAM maps, covering data cleaning, point-cloud correction, and training analysis.</li><li>Built a 2D-to-3D auto-labeling workflow using SAM masks, IPM projection, and OCC connected components to propagate 3D semantics; developed a BEV annotation tool for hard classes such as door frames.</li><li>Supported mobile robot perception-planning-control integration by deploying a DL planner, tuning four-steering-wheel chassis kinematics/control, and prototyping ROS2-based 6D arm teleoperation with VR controllers.</li></ul>'
    tech: "Techs: 3D OCC, Auto Labeling, LiDAR SLAM, DL Planner, ROS2/Kinematics"
