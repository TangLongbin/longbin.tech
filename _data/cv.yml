      time: "2025.7 - 至今"
      details: '<ul class="detail-list"><li>参与 RoboTruck 多模态 BEV 感知基础模型研发，设计 latent-to-early BEV temporal fusion：将历史帧 BEV feature 对齐并残差融合到当前帧，替代高成本多帧点云拼接；优化 OHEM 类别采样，部分 AP 提升 10-30%，漏检/误检降低约 30-40%。</li><li>负责 RoboTruck trailer detection 优化，基于 LiDAR BEV regression 引入运动学先验、动态 ROI 与 Kalman Filter 后处理，并通过数据重采样、onboard C++ 部署和闭环验证，使整体角度误差降低约 12%。</li><li>优化点云障碍物合并模型，结合 PointNet/Transformer 与上游语义先验判断 polygon 合并关系，缓解目标过切分，提升 tracking/PNC 输入完整性。</li><li>重构多源 heuristic hint selection，统一 box、track 与 FCN polygon 表示选择，基于几何一致性和 ROI/车道关系，使 under/over-segmentation 问题整体降低约 10%。</li></ul>'
      tech: "技术：BEV Perception，LiDAR-Camera Fusion，Transformer，C++/Python"
