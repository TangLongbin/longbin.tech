      time: "2024.2 - 2024.6"
      details: '<ul class="detail-list"><li>参与移动机器人 3D Semantic Occupancy 数据闭环，基于环视相机与 LiDAR SLAM 地图生成语义 OCC 监督，并完成数据清洗、点云修正与训练实验分析。</li><li>构建 2D-to-3D 自动标注流程，利用 SAM 生成语义 mask，经 IPM 投影与 OCC 连通块传播 3D 语义；开发 BEV 标注工具补充门框等困难类别。</li><li>参与移动机器人感知-规划-控制联调，部署 DL planner，调试四舵轮底盘运动学/控制，并基于 ROS2 与 VR 手柄实现机械臂 6D 遥操作原型。</li></ul>'
