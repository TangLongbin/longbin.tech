      time: "2023.10 - 2024.6"
      details: "设计一辆能够在园区（例如学校、公园）内的自主导航与配送的无人车。底盘采用六轮差速结构，配备双叉臂独立悬架，实现零转弯半径与稳定配送。采用 Autoware.universe 架构，“Lidar-IMU-Odometer-GPS-Radar”多传感器实现 SLAM、点云分割、路径规划与运动控制，并利用深度强化学习实现更适合园区复杂三维路面的局部路径规划。"
      tech: "技术：SLAM，ROS2，C/C++，Python，LQR/MPC，Reinforcement Learning"
